<svg xmlns="http://www.w3.org/2000/svg" width="960" height="232" viewBox="0 0 960 232" role="img" aria-labelledby="title">
  <title id="title">VL-Adversary</title>
  <defs>
    <linearGradient id="background" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#0A1324"/>
      <stop offset="1" stop-color="#151D3D"/>
    </linearGradient>
    <linearGradient id="edge">
      <stop stop-color="#38546E"/>
      <stop offset="1" stop-color="#535589"/>
    </linearGradient>
    <linearGradient id="route">
      <stop stop-color="#BBA7FF"/>
