    <text x="35" y="129" fill="#F6F8FF" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="750" letter-spacing="-2.2"><tspan fill="#72E8EF">VL</tspan><tspan>-Adversary</tspan></text>
    <path d="M40 158H101" stroke="url(#route)" stroke-width="3" stroke-linecap="round"/>
    <text x="39" y="192" fill="#B6C4DF" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Vision-language adversarial planning</text>
  </g>
  <rect x=".75" y=".75" width="958.5" height="230.5" rx="17.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
