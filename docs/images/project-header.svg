        <path d="M6-6V6" stroke="#C2AEFF" stroke-width="1.5"/>
      </g>
      <g id="ego" transform="translate(617 204)">
        <rect x="-15" y="-10" width="30" height="20" rx="5" fill="#194B59" stroke="#72E8EF" stroke-width="2"/>
        <path d="M6-6V6" stroke="#72E8EF" stroke-width="1.5"/>
      </g>
      <g id="target">
        <circle cx="716" cy="134" r="17" fill="none" stroke="#72E8EF" stroke-opacity=".38"/>
        <circle cx="716" cy="134" r="26" fill="none" stroke="#72E8EF" stroke-opacity=".17"/>
      </g>
    </g>

    <g font-family="Consolas, 'Liberation Mono', monospace" font-weight="700" font-size="13" letter-spacing="1.6">
      <rect x="39" y="35" width="7" height="7" rx="2" fill="#72E8EF"/>
      <text x="56" y="43" fill="#A9C9DC">CLOSED-LOOP DRIVING EVALUATION</text>
      <text x="915" y="209" text-anchor="end" fill="#9EB1CE">BEV SCHEMATIC</text>
