<svg xmlns="http://www.w3.org/2000/svg" width="960" height="232" viewBox="0 0 960 232" role="img" aria-labelledby="title description">
  <title id="title">VL-Adversary</title>
  <desc id="description">A scene observation feeds adversarial vehicle selection and trajectory planning, with a feedback arrow closing the loop.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#598AC2"/>
    </marker>
    <g id="car" stroke="currentColor" stroke-width="1.35">
      <rect x="-6" y="-10" width="12" height="20" rx="3.5" fill="#FAFCFF"/>
      <path d="M-4-5H4L3 0H-3ZM-4 5H4M-4 8H4" fill="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect x="2" y="2" width="956" height="228" rx="24" fill="#FFFCF5" stroke="#D8D4C8" stroke-width="1.5"/>
  <rect x="16" y="18" width="431" height="202" rx="19" fill="#D4DEE1"/>
  <rect x="14" y="14" width="431" height="202" rx="19" fill="#E5F0FA" stroke="#A5BACD" stroke-width="1.3"/>

  <g font-family="Trebuchet MS, Segoe UI, Arial, sans-serif">
    <rect x="36" y="34" width="248" height="26" rx="13" fill="#F7FBFF" stroke="#A4BDD4"/>
    <circle cx="49" cy="47" r="3.2" fill="#4376A8"/>
    <text x="59" y="51" fill="#334E65" font-weight="700" font-size="10.8" letter-spacing="1">CLOSED-LOOP DRIVING EVALUATION</text>
    <text x="34" y="123" fill="#202D3A" font-size="59" font-weight="700" letter-spacing="-1.8"><tspan fill="#315F90">VL</tspan><tspan>-Adversary</tspan></text>
    <path d="M37 145Q68 139 99 143" fill="none" stroke="#598AC2" stroke-width="2.6" stroke-linecap="round"/>
    <text x="37" y="179" fill="#394D5E" font-size="19" font-weight="700">Vision-language adversarial planning</text>
  </g>

  <g font-family="Trebuchet MS, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle" fill="#26333C">
    <rect x="470" y="38" width="141" height="127" rx="16" fill="#DCE1DC"/>
    <rect x="630" y="38" width="141" height="127" rx="16" fill="#EBDCCF"/>
    <rect x="790" y="38" width="141" height="127" rx="16" fill="#E7E0BD"/>
    <rect x="468" y="35" width="141" height="127" rx="16" fill="#DCEAF7" stroke="#7B96AF" stroke-width="1.3"/>
    <rect x="628" y="35" width="141" height="127" rx="16" fill="#FBE6D5" stroke="#A88974" stroke-width="1.3"/>
    <rect x="788" y="35" width="141" height="127" rx="16" fill="#FAF3C6" stroke="#A59861" stroke-width="1.3"/>

    <text x="538.5" y="61" font-size="16.5">Observe</text>
    <text x="698.5" y="61" font-size="16.5">Select</text>
    <text x="858.5" y="61" font-size="16.5">Plan</text>
    <rect x="493" y="74" width="91" height="57" rx="9" fill="#EEF5FC" stroke="#788C9E"/>
    <rect x="653" y="74" width="91" height="57" rx="9" fill="#FFF4E8" stroke="#A28C77"/>
    <rect x="813" y="74" width="91" height="57" rx="9" fill="#E7F1DC" stroke="#8A9D80"/>

    <path d="M509 80V125M569 80V125M669 80V125M729 80V125M829 80V125M889 80V125" fill="none" stroke="#5F7484" stroke-width="1.2"/>
    <path d="M539 80V125M699 80V125M859 80V125" fill="none" stroke="#718598" stroke-width="1.15" stroke-dasharray="4 4"/>
    <use href="#car" transform="translate(524 112)" color="#315F90"/>
    <use href="#car" transform="translate(554 92)" color="#B45B27"/>
    <use href="#car" transform="translate(684 111)" color="#315F90"/>
    <use href="#car" transform="translate(714 95)" color="#B45B27"/>
    <circle cx="684" cy="111" r="13" fill="none" stroke="#B45B27" stroke-width="1.6"/>
    <use href="#car" transform="translate(844 114)" color="#315F90"/>
    <path d="M845 103Q850 87 875 88" fill="none" stroke="#B7553A" stroke-width="1.7" stroke-dasharray="3 3" stroke-linecap="round"/>
    <path d="M871 88H879M875 84V92" fill="none" stroke="#B7553A" stroke-width="2" stroke-linecap="round"/>

    <text x="538.5" y="149" font-size="11.5" fill="#3D5D76">Scene inputs</text>
    <text x="698.5" y="149" font-size="11.5" fill="#78523B">Adversarial vehicle</text>
    <text x="858.5" y="149" font-size="11.5" fill="#625623">Executable trajectory</text>

    <g fill="none" stroke="#598AC2" stroke-width="1.9" stroke-linecap="round" marker-end="url(#arrow)">
      <path d="M610 101H625"/>
      <path d="M770 101H785"/>
      <path d="M859 163V188Q859 199 848 199H549Q538 199 538 188V166"/>
    </g>
    <rect x="612" y="186" width="174" height="25" rx="12.5" fill="#E9F2DE" stroke="#9DAE8D"/>
    <text x="699" y="202" fill="#43563B" font-size="11.5">Closed-loop feedback</text>
  </g>
</svg>
