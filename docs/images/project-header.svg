    </pattern>
    <clipPath id="frame">
      <rect width="960" height="232" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="960" height="232" fill="url(#background)"/>
    <rect x="500" width="460" height="232" fill="url(#grid)"/>
    <path d="M500 20V212" stroke="#3A4E70" stroke-dasharray="3 5"/>

    <g transform="translate(24 1)">
      <path d="M508 183C625 183 666 170 730 123S826 51 920 51" fill="none" stroke="#283553" stroke-width="92"/>
      <path d="M508 183C625 183 666 170 730 123S826 51 920 51" fill="none" stroke="#141E35" stroke-width="88"/>
      <path d="M508 183C625 183 666 170 730 123S826 51 920 51" fill="none" stroke="#5F7194" stroke-width="1.5" stroke-dasharray="8 8"/>

      <path id="ego-trail" d="M549 205H589" fill="none" stroke="#72E8EF" stroke-width="2.5" stroke-linecap="round"/>
      <path id="planned-route" d="M550 161H637C672 161 690 154 715 135" fill="none" stroke="url(#route)" stroke-width="2.5" stroke-dasharray="5 6" stroke-linecap="round"/>
      <path d="M705 137L716 134L713 145" fill="none" stroke="#72E8EF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <g id="adversary" transform="translate(578 161)">
